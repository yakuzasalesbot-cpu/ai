name: Signal ingest tests

on:
  push:
    branches:
      - feature/signal-group-ingest
    paths:
      - "04_AUTOMATION/signal_group_ingest/**"
      - ".github/workflows/signal-ingest-tests.yml"
  pull_request:
    paths:
      - "04_AUTOMATION/signal_group_ingest/**"
      - ".github/workflows/signal-ingest-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04_AUTOMATION/signal_group_ingest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile signal_ingest.py
      - name: Test
        run: python -m pytest -q
